name: Rootfs

# Builds Virtual Shell's default root filesystem (rootfs/build.sh) for the
# newest snapshot and publishes an immutable GitHub Release:
#   rootfs-v3.21-<date> / virtualshell-rootfs-aarch64.tar.gz (+ checksum/manifest)

on:
  workflow_run:
    workflows: [Snapshot]
    types: [completed]
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot date to build for (default: the newest)"
        type: string
        default: ""

permissions:
  contents: write

# Runs after Snapshot completes and when a specific snapshot is selected.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  rootfs:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Check out the package snapshot branch
        run: |
          git clone --quiet --depth 1 --single-branch --branch pages \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site

      - name: Choose the snapshot
        id: pick
        env:
          REQUESTED_SNAPSHOT: ${{ inputs.snapshot }}
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot="$REQUESTED_SNAPSHOT"
          [ -n "$snapshot" ] || snapshot=$(tail -n 1 site/v3.21/snapshots.txt)
          [[ "$snapshot" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid snapshot date" >&2; exit 1; }
          test -d "site/v3.21/$snapshot" || { echo "no snapshot $snapshot" >&2; exit 1; }
          tag="rootfs-v3.21-$snapshot"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists"
          else
            echo "build=1" >> "$GITHUB_OUTPUT"
          fi
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.pick.outputs.build == '1'

      - name: Build
        if: steps.pick.outputs.build == '1'
        env:
          SNAPSHOT: ${{ steps.pick.outputs.snapshot }}
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg SNAPSHOT="$SNAPSHOT" \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            --output type=local,dest=out .
          (cd out && sha256sum -c virtualshell-rootfs-aarch64.tar.gz.sha256)

      - name: Publish
        if: steps.pick.outputs.build == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.pick.outputs.snapshot }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh release create "$TAG" \
            out/virtualshell-rootfs-aarch64.tar.gz \
            out/virtualshell-rootfs-aarch64.tar.gz.sha256 \
            out/virtualshell-rootfs-aarch64.tar.gz.manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Virtual Shell rootfs v3.21 $SNAPSHOT" \
            --notes "Alpine v3.21 root filesystem built from the $SNAPSHOT package snapshot. Verify the archive with the accompanying SHA-256 file."
